# Form.io behind an already-running Traefik instance.
# Copy .env.example to .env and set FORMIO_DOMAIN, secrets, and Traefik names.
#
# Find the Traefik network:  docker network ls
# Confirm labels:            docker inspect <traefik-container>

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mdb-data:/data/db
    networks:
      - internal

  formio:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ROOT_EMAIL: ${ROOT_EMAIL}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      NODE_CONFIG: >-
        {"mongo":"mongodb://mongo:27017/formio","port":3001,"host":"${FORMIO_DOMAIN}","protocol":"https","domain":"https://${FORMIO_DOMAIN}","jwt":{"secret":"${JWT_SECRET}","expireTime":240},"mongoSecret":"${MONGO_SECRET}"}
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}
      - traefik.http.routers.formio.rule=Host(`${FORMIO_DOMAIN}`)
      - traefik.http.routers.formio.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.formio.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-myresolver}
      - traefik.http.services.formio.loadbalancer.server.port=3001

networks:
  internal:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik_network}
    external: true

volumes:
  mdb-data:
